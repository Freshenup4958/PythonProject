
services:
  db:
    image: postgres:17
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  web:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      RUN_MIGRATIONS: "1"
    expose:
      - "8000"
    volumes:
      - static_volume:/app/staticfiles
      - reports_volume:/app/reports
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/').read()"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static_volume:/app/staticfiles:ro
    depends_on:
      web:
        condition: service_healthy

  celery:
    build: .
    restart: unless-stopped
    command: celery -A bookstore worker --loglevel=info
    env_file:
      - .env
    environment:
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      RUN_MIGRATIONS: "0"
    volumes:
      - reports_volume:/app/reports
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
  celery-beat:
    build: .
    restart: unless-stopped
    command: celery -A bookstore beat --loglevel=info --schedule=/app/celerybeat/celerybeat-schedule
    env_file:
      - .env
    environment:
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      RUN_MIGRATIONS: "0"
    volumes:
      - celerybeat_data:/app/celerybeat
    depends_on:
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  static_volume:
  reports_volume:
  celerybeat_data:
