{% extends 'books/base.html' %}
{% load i18n %}

{% block title %}{% translate "Delete book" %}{% endblock %}

{% block content %}

<h1>{% translate "Delete book" %}</h1>

<p>
    {% translate "Are you sure you want to delete" %}
    <strong>{{ book.title }}</strong>?
</p>

<form method="post">
    {% csrf_token %}

    <button type="submit" class="btn btn-danger">
        {% translate "Yes, delete" %}
    </button>

    <a href="{% url 'books:book_detail' book.pk %}"
       class="btn btn-secondary">
        {% translate "Cancel" %}
    </a>
</form>

{% endblock %}
