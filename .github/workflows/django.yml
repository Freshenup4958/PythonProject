
name: Django CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Django_Bookstore

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: bookstore
          POSTGRES_USER: bookstore_user
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bookstore_user -d bookstore"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    env:
      DJANGO_SETTINGS_MODULE: bookstore.settings.development
      DJANGO_SECRET_KEY: github-actions-test-secret-key-at-least-32-characters
      POSTGRES_DB: bookstore
      POSTGRES_USER: bookstore_user
      POSTGRES_PASSWORD: test_password
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      SENTRY_DSN: ""

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: Django_Bookstore/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check code with Flake8
        run: python -m flake8 books accounts bookstore

      - name: Check formatting with Black
        run: python -m black --check books accounts bookstore

      - name: Check Django
        run: python manage.py check

      - name: Run tests with coverage
        run: >
          python -m pytest
          --cov=books
          --cov=accounts
          --cov-report=term-missing
          --cov-report=xml:coverage.xml
          --cov-fail-under=85

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: Django_Bookstore/coverage.xml

  docker:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t django-bookstore:ci ./Django_Bookstore
