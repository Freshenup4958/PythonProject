services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: warehouse_db
      POSTGRES_USER: warehouse_user
      POSTGRES_PASSWORD: ${WAREHOUSE_DB_PASSWORD:?Set WAREHOUSE_DB_PASSWORD}
    volumes:
      - warehouse_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U warehouse_user -d warehouse_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped

  web:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:8001:8001"
    environment:
      DATABASE_URL: "postgresql://warehouse_user:${WAREHOUSE_DB_PASSWORD}@db:5432/warehouse_db"
      REDIS_URL: "redis://redis:6379/0"
      DJANGO_SECRET_KEY: ${WAREHOUSE_SECRET_KEY:?Set WAREHOUSE_SECRET_KEY}
      DJANGO_ALLOWED_HOSTS: "127.0.0.1,localhost,host.docker.internal"
      SENTRY_DSN: ${SENTRY_DSN:-}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started


  celery:
    build: .
    restart: unless-stopped
    user: "10001:10001"
    command: celery -A warehouse worker --loglevel=info
    environment:
      DATABASE_URL: "postgresql://warehouse_user:${WAREHOUSE_DB_PASSWORD}@db:5432/warehouse_db"
      REDIS_URL: "redis://redis:6379/0"
      DJANGO_SECRET_KEY: ${WAREHOUSE_SECRET_KEY:?Set WAREHOUSE_SECRET_KEY}
      DJANGO_ALLOWED_HOSTS: "127.0.0.1,localhost,host.docker.internal"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started


  celery-beat:
    build: .
    restart: unless-stopped
    user: "10001:10001"
    command: celery -A warehouse beat --loglevel=info --schedule=/tmp/celerybeat-schedule
    environment:
      DATABASE_URL: "postgresql://warehouse_user:${WAREHOUSE_DB_PASSWORD}@db:5432/warehouse_db"
      REDIS_URL: "redis://redis:6379/0"
      DJANGO_SECRET_KEY: ${WAREHOUSE_SECRET_KEY:?Set WAREHOUSE_SECRET_KEY}
      DJANGO_ALLOWED_HOSTS: "127.0.0.1,localhost,host.docker.internal"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:8002:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web



volumes:
  warehouse_postgres_data:
